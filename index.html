<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSU x Canva - Countdown</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>

    <div class="school-logo">
        <img src="your-logo.png" alt="Logo">
        <span>ชื่อโรงเรียน/มหาวิทยาลัย</span>
    </div>

    <div class="container animate__animated animate__fadeIn">
        <h1 id="main-title">กำลังโหลด...</h1>
        <p id="sub-title"></p>

        <div class="countdown-container">
            <div class="time-box"><span id="days">00</span><p>วัน</p></div>
            <div class="time-box"><span id="hours">00</span><p>ชม.</p></div>
            <div class="time-box"><span id="minutes">00</span><p>นาที</p></div>
            <div class="time-box"><span id="seconds">00</span><p>วิ</p></div>
        </div>

        <button id="info-btn" onclick="toggleModal()">ดูข้อมูลเพิ่มเติม</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleModal()">&times;</span>
            <div id="additional-info">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
