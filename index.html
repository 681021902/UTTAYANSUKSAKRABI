<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary: #ffcc00; --text: #ffffff; }
        body { 
            margin: 0; font-family: 'Kanit', sans-serif; 
            background: #000; color: var(--text); overflow: hidden;
        }
        
        /* พื้นหลังแบบวิดีโอหรือรูปภาพที่เปลี่ยนได้ */
        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -1; filter: brightness(0.6); object-fit: cover;
        }

        /* โลโก้มุมจอตามสั่ง */
        .header-logo {
            position: absolute; top: 30px; left: 30px; display: flex; align-items: center; gap: 15px;
            z-index: 10;
        }
        .header-logo img { width: 60px; height: auto; border-radius: 50%; border: 2px solid var(--primary); }
        .header-logo span { font-weight: 700; font-size: 1.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* ส่วนเนื้อหาหลัก */
        .main-content {
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 20px;
        }

        .countdown-grid {
            display: flex; gap: 20px; margin: 30px 0;
        }
        .time-card {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; min-width: 80px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }
        .time-card span { display: block; font-size: 2.5rem; font-weight: 700; color: var(--primary); }
        
        .btn-more {
            background: var(--primary); color: #000; border: none; padding: 15px 40px;
            font-size: 1.1rem; font-weight: 700; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(255, 204, 0, 0.3);
        }
        .btn-more:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255, 204, 0, 0.5); }

        /* หน้าต่าง Pop-up ข้อมูลเพิ่มเติม (อิสระ) */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #fff; color: #333; width: 85%; max-width: 800px; max-height: 80vh;
            border-radius: 30px; padding: 40px; position: relative; overflow-y: auto;
        }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 2rem; cursor: pointer; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <img id="bg-image" src="" style="position:fixed; width:100%; height:100%; object-fit:cover; z-index:-1; display:none;">
    
    <div class="header-logo animate__animated animate__fadeInLeft">
        <img id="school-logo-img" src="https://via.placeholder.com/60" alt="Logo">
        <span id="school-name">LOADING SCHOOL...</span>
    </div>

    <div class="main-content">
        <h1 id="title" class="animate__animated animate__fadeInDown" style="font-size: 3.5rem; margin-bottom: 0;">Loading...</h1>
        <p id="description" class="animate__animated animate__fadeInUp"></p>

        <div class="countdown-grid">
            <div class="time-card"> <span id="days">00</span> <p>DAYS</p> </div>
            <div class="time-card"> <span id="hours">00</span> <p>HOURS</p> </div>
            <div class="time-card"> <span id="mins">00</span> <p>MINS</p> </div>
            <div class="time-card"> <span id="secs">00</span> <p>SECS</p> </div>
        </div>

        <button class="btn-more animate__animated animate__bounceIn" onclick="openModal()">DISCOVER MORE</button>
    </div>

    <div id="infoOverlay" class="overlay" onclick="closeModal(event)">
        <div class="modal-content animate__animated animate__zoomIn" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="dynamic-info">
                </div>
        </div>
    </div>

    <script>
        // เปลี่ยนลิงก์ข้างล่างนี้เป็นลิงก์ CSV จาก Google Sheets ของคุณ
        const SHEET_CSV_URL = 'ใส่_LINK_CSV_ตรงนี้';

        async function loadData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                const config = {};
                
                rows.forEach(row => {
                    const [key, value] = row.split(',');
                    if(key) config[key.trim()] = value.trim();
                });

                // อัปเดตข้อมูลบนเว็บ
                document.getElementById('title').innerText = config.main_title;
                document.getElementById('school-name').innerText = config.school_name;
                document.getElementById('description').innerText = config.description;
                document.getElementById('dynamic-info').innerHTML = config.additional_info;
                
                if(config.bg_url) {
                    const bg = document.getElementById('bg-image');
                    bg.src = config.bg_url;
                    bg.style.display = 'block';
                }

                startTimer(config.target_date);
            } catch (e) { console.error("Data load failed", e); }
        }

        function startTimer(target) {
            const dest = new Date(target).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = dest - now;
                if(diff < 0) return;

                document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }, 1000);
        }

        function openModal() { document.getElementById('infoOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('infoOverlay').style.display = 'none'; }

        loadData();
    </script>
</body>
</html>
